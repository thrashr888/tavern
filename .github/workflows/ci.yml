name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Durable host tests
        working-directory: bridge/tavern-durable
        run: node --version && npm test
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: |
          set -o pipefail
          swift test 2>&1 | tee test.log
          # Surface the test count as an annotation so it is readable from the checks API.
          echo "::notice title=Tests::$(grep -E 'Executed [0-9]+ tests' test.log | tail -1)"
