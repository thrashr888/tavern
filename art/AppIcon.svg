<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#25445a"/>
      <stop offset="1" stop-color="#0e1b26"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.6" r="0.55">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d79a5a"/>
      <stop offset="1" stop-color="#9a5c2c"/>
    </linearGradient>
    <linearGradient id="iron" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5d6470"/>
      <stop offset="1" stop-color="#2a2e35"/>
    </linearGradient>
    <linearGradient id="beer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2a516"/>
      <stop offset="0.45" stop-color="#ffd25a"/>
      <stop offset="1" stop-color="#e0900f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="squircle"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>

  <!-- Night sky tile with a warm lamp glow -->
  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="824" fill="url(#sky)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
    <circle cx="250" cy="200" r="5" fill="#fff" opacity="0.7"/>
    <circle cx="790" cy="175" r="4" fill="#fff" opacity="0.6"/>
    <circle cx="860" cy="300" r="3" fill="#fff" opacity="0.5"/>
    <circle cx="170" cy="330" r="3" fill="#fff" opacity="0.5"/>
  </g>

  <!-- Iron bracket -->
  <g filter="url(#shadow)">
    <rect x="168" y="208" width="688" height="44" rx="14" fill="url(#iron)"/>
    <rect x="180" y="214" width="664" height="8" rx="4" fill="#fff" opacity="0.18"/>
    <circle cx="190" cy="230" r="14" fill="#1d2026"/>
    <circle cx="834" cy="230" r="14" fill="#1d2026"/>

    <!-- Chains -->
    <g fill="none" stroke="#3b4048" stroke-width="12">
      <ellipse cx="332" cy="282" rx="14" ry="24"/>
      <ellipse cx="332" cy="326" rx="14" ry="24"/>
      <ellipse cx="692" cy="282" rx="14" ry="24"/>
      <ellipse cx="692" cy="326" rx="14" ry="24"/>
    </g>

    <!-- Wooden sign, slightly chipped corners -->
    <path d="M232 350 L792 350 L812 380 L800 420 L816 470 L808 640 L820 700 L796 790 L612 800 L580 776 L548 800 L236 794 L210 742 L222 690 L206 560 L218 470 L204 410 Z"
          fill="url(#wood)" stroke="#5a3418" stroke-width="14" stroke-linejoin="round"/>
    <!-- Grain -->
    <g stroke="#7a4520" stroke-width="7" stroke-linecap="round" opacity="0.55">
      <line x1="250" y1="440" x2="340" y2="440"/>
      <line x1="700" y1="520" x2="776" y2="520"/>
      <line x1="252" y1="640" x2="322" y2="640"/>
      <line x1="690" y1="730" x2="770" y2="730"/>
    </g>
    <circle cx="332" cy="372" r="9" fill="#3b2412"/>
    <circle cx="692" cy="372" r="9" fill="#3b2412"/>
  </g>

  <!-- Beer mug -->
  <g stroke="#4a2a12" stroke-width="14" stroke-linejoin="round" stroke-linecap="round">
    <!-- Handle -->
    <path d="M598 520 L652 520 Q686 520 686 556 L686 648 Q686 684 652 684 L598 684" fill="none" stroke-width="40"/>
    <path d="M598 520 L652 520 Q686 520 686 556 L686 648 Q686 684 652 684 L598 684" fill="none" stroke="#d6dde3" stroke-width="18"/>
    <!-- Glass body -->
    <path d="M396 478 L606 478 L598 726 Q598 748 576 748 L426 748 Q404 748 404 726 Z" fill="url(#beer)"/>
    <!-- Glass ribs -->
    <g stroke="#fff3c4" stroke-width="12" opacity="0.75">
      <line x1="450" y1="540" x2="452" y2="702"/>
      <line x1="501" y1="540" x2="501" y2="702"/>
      <line x1="552" y1="540" x2="550" y2="702"/>
    </g>
    <!-- Foam -->
    <path d="M384 498 Q368 448 410 436 Q420 398 466 408 Q494 380 532 404 Q578 392 590 432 Q630 440 618 490 Q616 512 594 508 L408 508 Q388 512 384 498 Z" fill="#fffaf0"/>
  </g>
  <circle cx="436" cy="586" r="7" fill="#fff" opacity="0.8"/>
  <circle cx="530" cy="640" r="6" fill="#fff" opacity="0.7"/>
  <circle cx="480" cy="680" r="5" fill="#fff" opacity="0.7"/>
</svg>
